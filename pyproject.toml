[project]
name = "pricesniperbot"
version = "0.1.0"
description = "Bot assíncrono para monitoramento de preços, promoções e auto-checkout"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "curl-cffi>=0.7.0",
    "playwright>=1.47.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true